    { "期末复习" = "exams/final-review.md" },
  ] },
  { "课外学习" = [
    { "英语" = "learning/english.md" },
    { "如何找课程" = "learning/finding-courses.md" },
  ] },
  { "保研笔试与面试" = [
    { "信息来源" = "admission/information.md" },
    { "笔试" = "admission/written-test.md" },
    { "面试" = "admission/interview.md" },
    { "学校案例" = "admission/cases.md" },
  ] },
]

[project.theme]
variant = "classic"
language = "zh"
features = [
  "navigation.sections",
  "navigation.tracking",
  "navigation.top",
  "search.highlight",
